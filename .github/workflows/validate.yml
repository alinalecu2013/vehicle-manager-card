name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

# doar citire: verificarea nu poate modifica depozitul
permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main, 2026-10
        with:
          category: plugin
          ignore: brands
